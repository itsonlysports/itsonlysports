<section class="newsletter" id="newsletter">
  <div class="newsletter-copy">
    <p class="series-label">Newsletter</p>
    <h2>{{ site.newsletter_name }}</h2>
    <p>{{ site.newsletter_pitch }}</p>
  </div>
  {% if site.buttondown_username and site.buttondown_username != "" %}
  <form class="newsletter-form" action="https://buttondown.com/api/emails/embed-subscribe/{{ site.buttondown_username }}" method="post" target="_blank">
    <label for="bd-email" class="sr-only">Email address</label>
    <input type="email" name="email" id="bd-email" placeholder="you@example.com" required>
    <button type="submit">Subscribe</button>
  </form>
  {% else %}
  <form class="newsletter-form" onsubmit="return false">
    <label for="bd-email" class="sr-only">Email address</label>
    <input type="email" id="bd-email" placeholder="you@example.com" disabled>
    <button type="button" disabled>Opening soon</button>
  </form>
  {% endif %}
  <p class="fine">Free. Unsubscribe anytime. For entertainment only, 21+.</p>
</section>
